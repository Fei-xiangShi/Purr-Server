services:
  caddy:
    profiles: ["bundled-proxy"]
    restart: unless-stopped
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      purr-server:
        condition: service_healthy
      livekit:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      PURR_API_DOMAIN: ${PURR_API_DOMAIN:?PURR_API_DOMAIN is required}
      PURR_LIVEKIT_DOMAIN: ${PURR_LIVEKIT_DOMAIN:?PURR_LIVEKIT_DOMAIN is required}
      PURR_STORAGE_DOMAIN: ${PURR_STORAGE_DOMAIN:?PURR_STORAGE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128

  postgres:
    restart: unless-stopped
    image: postgres:16.11-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_DB: purr
      POSTGRES_USER: purr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purr -d purr"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 256

  redis:
    restart: unless-stopped
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128

  minio:
    restart: unless-stopped
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z@sha256:a929054ae025fa7997857cd0e2a2e3029238e31ad89877326dc032f4c1a14259
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    mem_limit: 512m
    cpus: 1.00
    pids_limit: 256

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z@sha256:f7089203eca4c8e538d5e5c69303f568735366640e62917e05a98ce615a1edd9
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: purr-recordings
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  livekit:
    restart: unless-stopped
    image: livekit/livekit-server:v1.13.3@sha256:483b8b7b5b0654f91f1e8bdc7b46fcd37fd9911612ecf627f97e3185a89825bd
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_IP: ${LIVEKIT_NODE_IP:?LIVEKIT_NODE_IP is required}
      LIVEKIT_CONFIG: |
        port: 7880
        redis:
          address: redis:6379
          password: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        rtc:
          port_range_start: 50000
          port_range_end: 50100
          tcp_port: 7881
          use_external_ip: false
        keys:
          ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
        webhook:
          api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
          urls:
            - http://purr-server:8080/webhooks/livekit
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 1g
    cpus: 2.00
    pids_limit: 512

  egress:
    restart: unless-stopped
    image: livekit/egress:v1.13.0@sha256:980ff439431df2c773573721ab6da19e15bdc1f049ab7cb80e87470bf174c12f
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
        api_secret: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
        ws_url: ws://livekit:7880
        insecure: true
        enable_room_composite_sdk_source: true
        redis:
          address: redis:6379
          password: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        health_port: 8081
        logging:
          level: info
    cap_add:
      - SYS_ADMIN
    mem_limit: 2g
    cpus: 2.00
    pids_limit: 1024

  purr-server:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started
      egress:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PURR_ENVIRONMENT: production
      PURR_LOG_LEVEL: ${PURR_LOG_LEVEL:-INFO}
      PURR_DB_JDBC_URL: jdbc:postgresql://postgres:5432/purr
      PURR_DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      PURR_DB_USERNAME: purr
      PURR_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PURR_DB_MAXIMUM_POOL_SIZE: 5
      PURR_AUTH_JWT_SECRET: ${PURR_AUTH_JWT_SECRET:?PURR_AUTH_JWT_SECRET is required}
      PURR_AUTH_ACCESS_TOKEN_TTL_SECONDS: ${PURR_AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      PURR_AUTH_REFRESH_TOKEN_TTL_SECONDS: ${PURR_AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      PURR_AUTH_ISSUER: purr-server
      PURR_AUTH_AUDIENCE: purr-mobile
      PURR_AUTH_USER_A_ID: ${PURR_AUTH_USER_A_ID:?PURR_AUTH_USER_A_ID is required}
      PURR_AUTH_USER_A_USERNAME: ${PURR_AUTH_USER_A_USERNAME:?PURR_AUTH_USER_A_USERNAME is required}
      PURR_AUTH_USER_A_DISPLAY_NAME: ${PURR_AUTH_USER_A_DISPLAY_NAME:?PURR_AUTH_USER_A_DISPLAY_NAME is required}
      PURR_AUTH_USER_A_AVATAR_URL: ${PURR_AUTH_USER_A_AVATAR_URL:-}
      PURR_AUTH_USER_A_PASSWORD: ${PURR_AUTH_USER_A_PASSWORD:?PURR_AUTH_USER_A_PASSWORD is required}
      PURR_AUTH_USER_B_ID: ${PURR_AUTH_USER_B_ID:?PURR_AUTH_USER_B_ID is required}
      PURR_AUTH_USER_B_USERNAME: ${PURR_AUTH_USER_B_USERNAME:?PURR_AUTH_USER_B_USERNAME is required}
      PURR_AUTH_USER_B_DISPLAY_NAME: ${PURR_AUTH_USER_B_DISPLAY_NAME:?PURR_AUTH_USER_B_DISPLAY_NAME is required}
      PURR_AUTH_USER_B_AVATAR_URL: ${PURR_AUTH_USER_B_AVATAR_URL:-}
      PURR_AUTH_USER_B_PASSWORD: ${PURR_AUTH_USER_B_PASSWORD:?PURR_AUTH_USER_B_PASSWORD is required}
      PURR_PAIR_ID: ${PURR_PAIR_ID:?PURR_PAIR_ID is required}
      PURR_PAIR_BONDED_AT_EPOCH_MILLIS: ${PURR_PAIR_BONDED_AT_EPOCH_MILLIS:?PURR_PAIR_BONDED_AT_EPOCH_MILLIS is required}
      PURR_PAIR_USER_A_ID: ${PURR_AUTH_USER_A_ID:?PURR_AUTH_USER_A_ID is required}
      PURR_PAIR_USER_B_ID: ${PURR_AUTH_USER_B_ID:?PURR_AUTH_USER_B_ID is required}
      PURR_LIVEKIT_WS_URL: wss://${PURR_LIVEKIT_DOMAIN:?PURR_LIVEKIT_DOMAIN is required}
      PURR_LIVEKIT_HTTP_URL: http://livekit:7880
      PURR_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      PURR_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      PURR_LIVEKIT_TOKEN_TTL_SECONDS: 900
      PURR_RECORDING_PROVIDER: livekit
      PURR_RECORDING_ENABLED: true
      PURR_RECORDING_ID_PREFIX: rec
      PURR_RECORDING_FILE_PREFIX: recordings
      PURR_RECORDING_BUCKET: purr-recordings
      PURR_RECORDING_ENDPOINT: http://minio:9000
      PURR_RECORDING_PUBLIC_ENDPOINT: https://${PURR_STORAGE_DOMAIN:?PURR_STORAGE_DOMAIN is required}
      PURR_RECORDING_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      PURR_RECORDING_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      PURR_RECORDING_REGION: us-east-1
      PURR_RECORDING_FORCE_PATH_STYLE: true
      PURR_RECORDING_RECOVERY_ENABLED: true
      PURR_RECORDING_RECOVERY_INTERVAL_SECONDS: 30
      PURR_RECORDING_RECOVERY_STALE_AFTER_SECONDS: 90
      PURR_RECORDING_RECOVERY_MAX_ATTEMPTS: 5
      PURR_RECORDING_DOWNLOAD_URL_TTL_SECONDS: ${PURR_RECORDING_DOWNLOAD_URL_TTL_SECONDS:-300}
      PURR_RECORDING_CONSENT_POLICY_VERSION: ${PURR_RECORDING_CONSENT_POLICY_VERSION:-2026-01}
      PURR_RECORDING_CLEANUP_ENABLED: true
      PURR_RECORDING_RETENTION_DAYS: ${PURR_RECORDING_RETENTION_DAYS:-30}
      PURR_RECORDING_CLEANUP_INTERVAL_SECONDS: ${PURR_RECORDING_CLEANUP_INTERVAL_SECONDS:-3600}
      PURR_RECORDING_CLEANUP_BATCH_SIZE: ${PURR_RECORDING_CLEANUP_BATCH_SIZE:-100}
      PURR_RECORDING_CLEANUP_MAX_ATTEMPTS: ${PURR_RECORDING_CLEANUP_MAX_ATTEMPTS:-10}
      PURR_REALTIME_PROVIDER: redis
      PURR_REALTIME_REDIS_URI: redis://redis:6379
      PURR_REALTIME_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      PURR_REALTIME_CHANNEL: purr:realtime
      PURR_OUTBOX_POLL_INTERVAL_MILLIS: ${PURR_OUTBOX_POLL_INTERVAL_MILLIS:-100}
      PURR_OUTBOX_BATCH_SIZE: ${PURR_OUTBOX_BATCH_SIZE:-100}
      PURR_OUTBOX_LEASE_SECONDS: ${PURR_OUTBOX_LEASE_SECONDS:-30}
      PURR_OUTBOX_MAX_ATTEMPTS: ${PURR_OUTBOX_MAX_ATTEMPTS:-10}
      PURR_OUTBOX_RETRY_BASE_SECONDS: ${PURR_OUTBOX_RETRY_BASE_SECONDS:-1}
      PURR_OUTBOX_RETRY_MAX_SECONDS: ${PURR_OUTBOX_RETRY_MAX_SECONDS:-300}
      PURR_RATE_LIMIT_PROVIDER: redis
      PURR_RATE_LIMIT_LIMIT: ${PURR_RATE_LIMIT_LIMIT:-10}
      PURR_RATE_LIMIT_REFILL_PERIOD_SECONDS: ${PURR_RATE_LIMIT_REFILL_PERIOD_SECONDS:-60}
      PURR_RATE_LIMIT_REDIS_URI: redis://redis:6379
      PURR_RATE_LIMIT_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      PURR_RATE_LIMIT_KEY_PREFIX: purr:rate-limit:auth
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 256

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
