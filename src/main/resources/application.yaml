ktor:
  deployment:
    port: 8080
  application:
    modules:
      - life.fxs.purr.server.ApplicationKt.module

purr:
  environment: development
  auth:
    accessTokenTtlSeconds: 3600
    refreshTokenTtlSeconds: 2592000
    issuer: purr-server
    audience: purr-mobile
    jwtSecret: dev-jwt-secret-change-me-at-least-32-bytes
    seedUsers:
      userA:
        userId: user-a
        username: user-a
        password: pass-a
        displayName: Purr Alpha
        avatarUrl: ""
      userB:
        userId: user-b
        username: user-b
        password: pass-b
        displayName: Purr Beta
        avatarUrl: ""
  pair:
    pairId: pair-demo
    bondedAtEpochMillis: 1735689600000
    userAId: user-a
    userBId: user-b
  livekit:
    wsUrl: "ws://localhost:7880"
    httpUrl: "http://localhost:7880"
    apiKey: devkey
    apiSecret: devsecret
    tokenTtlSeconds: 3600
  recording:
    enabled: true
    provider: in_memory
    idPrefix: rec
    filePrefix: recordings
    bucket: purr-recordings
    endpoint: "http://localhost:9000"
    publicEndpoint: "http://localhost:9000"
    accessKey: minioadmin
    secretKey: minioadmin
    region: us-east-1
    forcePathStyle: true
    recoveryEnabled: false
    recoveryIntervalSeconds: 30
    recoveryStaleAfterSeconds: 90
    recoveryMaxAttempts: 5
    downloadUrlTtlSeconds: 300
    consentPolicyVersion: "2026-01"
    cleanupEnabled: false
    retentionDays: 30
    cleanupIntervalSeconds: 3600
    cleanupBatchSize: 100
    cleanupMaxAttempts: 10
  avatar:
    bucket: purr-avatars
    endpoint: "http://localhost:9000"
    publicEndpoint: "http://localhost:9000"
    accessKey: purr-avatar-dev
    secretKey: purr-avatar-dev-secret
    region: us-east-1
    forcePathStyle: true
    outputSizePixels: 512
    maxSourceDimensionPixels: 8192
    maxSourcePixels: 16000000
    jpegQualityPercent: 88
    maxOutputBytes: 1048576
    maxConcurrentProcessing: 2
    cleanupEnabled: false
    cleanupIntervalSeconds: 60
    cleanupBatchSize: 100
    cleanupMaxAttempts: 20
    cleanupRetryBaseSeconds: 5
    cleanupRetryMaxSeconds: 3600
    orphanGraceSeconds: 3600
  realtime:
    provider: local
    redisUri: "redis://localhost:6379"
    redisPassword: ""
    channel: "purr:realtime"
  outbox:
    pollIntervalMillis: 100
    batchSize: 100
    leaseSeconds: 30
    maxAttempts: 10
    retryBaseSeconds: 1
    retryMaxSeconds: 300
  push:
    enabled: false
    provider: fcm
    fcmProjectId: "purr-development"
    fcmServiceAccountPath: ""
    messageTtlSeconds: 60
  callReconciliation:
    enabled: false
    intervalSeconds: 10
    waitingTtlSeconds: 120
    emptyRoomGraceSeconds: 15
    batchSize: 100
  rateLimit:
    provider: local
    limit: 10
    refillPeriodSeconds: 60
    redisUri: "redis://localhost:6379"
    redisPassword: ""
    keyPrefix: "purr:rate-limit:auth"
  database:
    jdbcUrl: "jdbc:h2:mem:purr;MODE=PostgreSQL;DB_CLOSE_DELAY=0"
    driverClassName: org.h2.Driver
    username: sa
    password: ""
    maximumPoolSize: 5
