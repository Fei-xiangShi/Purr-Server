services:
  livekit:
    # The production service discovers its public address and mounts TLS files
    # for embedded TURN. Those assumptions do not hold in a Windows
    # Docker Desktop / Android Emulator test stack: the certificate bind paths
    # become directories and public-IP discovery can be blocked. Keep signaling
    # and direct host ICE enabled, advertise LIVEKIT_NODE_IP, and leave TURN to
    # production deployments.
    restart: "no"
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        redis:
          address: redis:6379
          password: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        rtc:
          port_range_start: 50000
          port_range_end: 50100
          tcp_port: 7881
          stun_servers:
            - stun.l.google.com:19302
            - stun.cloudflare.com:3478
          use_external_ip: false
        turn:
          enabled: false
        keys:
          ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
        webhook:
          api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
          urls:
            - http://purr-server:8080/webhooks/livekit

  purr-server:
    environment:
      PURR_ENVIRONMENT: development
      PURR_PUSH_ENABLED: "false"
      PURR_PUSH_PROVIDER: fcm
      PURR_PUSH_FCM_PROJECT_ID: local-debug
      PURR_LIVEKIT_WS_URL: ws://${PURR_LIVEKIT_HOST:-127.0.0.1}:7880
      PURR_MEDIAMTX_PUBLIC_BASE_URL: http://${PURR_MEDIAMTX_HOST:-127.0.0.1}:8889
      PURR_MEDIAMTX_SRT_PUBLIC_HOST: ${PURR_MEDIAMTX_HOST:-127.0.0.1}
      PURR_RECORDING_ENABLED: "true"
      PURR_GOOGLE_DRIVE_ENABLED: "false"

  mediamtx:
    environment:
      # Also advertise the Compose-network address so containerized OBS/FFmpeg
      # E2E publishers can complete ICE. Android emulators still select the
      # explicit 10.0.2.2 candidate supplied by MEDIAMTX_WEBRTC_PUBLIC_HOST.
      MTX_WEBRTCIPSFROMINTERFACES: "true"
    ports:
      # WHIP/WHEP signaling is normally served through Caddy. Publish it only
      # on host loopback for local OBS and Android-emulator E2E runs.
      - "127.0.0.1:8889:8889"
